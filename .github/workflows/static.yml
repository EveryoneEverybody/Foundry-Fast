name: Build and deploy Foundry extension

on:
  push:
    branches: ["master", "release/foundry-fast"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or SHA to package
        required: true
        default: release/foundry-fast
        type: string

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  helper:
    runs-on: windows-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      has_bridge: ${{ steps.source.outputs.has_bridge }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
      - name: Identify source and helper
        id: source
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          $hasBridge = Test-Path tools/h3_object_bridge/Cargo.toml
          "has_bridge=$($hasBridge.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Build and test H3 helpers
        if: steps.source.outputs.has_bridge == 'true'
        shell: pwsh
        run: |
          cargo test --manifest-path tools/h3_object_bridge/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --manifest-path tools/h3_object_bridge/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($helper in @('h3-object-bridge.exe', 'h3-shader-bridge.exe')) {
            if (!(Test-Path "tools/h3_object_bridge/target/release/$helper")) { throw "Missing helper: $helper" }
          }
      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.has_bridge == 'true'
        with:
          name: pages-h3-helpers
          path: tools/h3_object_bridge/target/release/*.exe
          if-no-files-found: error

  performance:
    needs: helper
    uses: ./.github/workflows/performance-check.yml
    with:
      source_ref: ${{ needs.helper.outputs.source_sha }}

  deploy:
    needs: [helper, performance]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.helper.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        if: needs.helper.outputs.has_bridge == 'true'
        with:
          name: pages-h3-helpers
          path: blender/addons/io_scene_foundry/h3_import/bin
      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .cache/blender-5.2.1-linux-x64
          key: blender-5.2.1-linux-x64
      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -L --fail --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C .cache
      - name: Download CoACD wheel
        run: |
          curl -L --fail --retry 3 https://files.pythonhosted.org/packages/00/83/c50472ce98175fddd86d4aba861fea89f30350a5487880b3a81d34915a85/coacd-1.0.11-cp39-abi3-win_amd64.whl -o blender/addons/io_scene_foundry/wheels/coacd-1.0.11-cp39-abi3-win_amd64.whl
          echo "4de22f70d1a3fa8c44698c8006a223fe5fb0ee84b76adecf3726cf2003e9145f  blender/addons/io_scene_foundry/wheels/coacd-1.0.11-cp39-abi3-win_amd64.whl" | sha256sum -c -
      - name: Build extension repository
        run: |
          mkdir -p site/api/v1/extensions
          rm -f site/api/v1/extensions/io_scene_foundry.zip site/api/v1/extensions/index.json site/api/v1/extensions/index.html
          .cache/blender-5.2.1-linux-x64/blender --command extension build --source-dir blender/addons/io_scene_foundry --output-filepath site/api/v1/extensions/io_scene_foundry.zip
          python3 tests/verify_release_package.py site/api/v1/extensions/io_scene_foundry.zip
          .cache/blender-5.2.1-linux-x64/blender --command extension server-generate --repo-dir site/api/v1/extensions --html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published extension feed
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 tests/verify_published_feed.py
