name: Test parallel bitmap preparation

on:
  push:
    branches: ["feature/bitmap-preprocess"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitmap-workers-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test existing extraction helpers
        shell: pwsh
        run: |
          cargo test --manifest-path tools/h3_object_bridge/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --manifest-path tools/h3_object_bridge/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path tools/h3_animation_bridge/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --manifest-path tools/h3_animation_bridge/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache Windows Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: .cache/blender-5.2.1-windows-x64
          key: blender-5.2.1-windows-x64
      - name: Download Windows Blender
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache | Out-Null
          curl.exe -L --fail --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-windows-x64.zip -o "$env:RUNNER_TEMP/blender.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive "$env:RUNNER_TEMP/blender.zip" .cache
      - name: Test detached workers on Windows
        shell: pwsh
        run: |
          & .cache/blender-5.2.1-windows-x64/5.2/python/bin/python.exe -m unittest discover -s tests -p test_bitmap_workers.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .cache/blender-5.2.1-windows-x64/blender.exe --background --factory-startup --python-exit-code 1 --python tests/blender_parallel_bitmaps_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: bitmap-test-helpers-windows
          path: |
            tools/h3_object_bridge/target/release/h3-object-bridge.exe
            tools/h3_object_bridge/target/release/h3-shader-bridge.exe
            tools/h3_animation_bridge/target/release/h3-animation-bridge.exe
          if-no-files-found: error

  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test existing validation and cache identities
        run: |
          python3 -m unittest discover -s tests -p 'test_scenario_*.py' -v
          python3 -m unittest discover -s tests -p 'test_h3_import*.py' -v
      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: .cache/blender-5.2.1-linux-x64
          key: blender-5.2.1-linux-x64
      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -L --fail --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C .cache
      - name: Test detached workers and Blender image loading
        run: |
          .cache/blender-5.2.1-linux-x64/5.2/python/bin/python3.13 -m unittest discover -s tests -p test_bitmap_workers.py -v
          .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/blender_parallel_bitmaps_smoke.py
      - name: Test direct reference dispatch and UI
        run: .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/blender_scenario_direct_smoke.py
      - name: Test scenario references, material drivers and persistence
        run: .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/blender_scenario_reference_drivers_smoke.py
      - name: Test existing animation paths
        run: |
          for test in animation_persistence animation_append overlay blend_screen; do
            .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/blender_h3_${test}_smoke.py
          done
      - name: Test existing geometry and material paths
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          for test in import preferences materials provenance illumination reach volumes; do
            xvfb-run -a .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/blender_h3_${test}_smoke.py
          done

  package:
    needs: [helper, blender]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bitmap-test-helpers-windows
          path: .cache/helpers
      - name: Install built helpers
        run: |
          mkdir -p blender/addons/io_scene_foundry/h3_import/bin
          find .cache/helpers -name '*.exe' -exec cp {} blender/addons/io_scene_foundry/h3_import/bin/ \;
          test -f blender/addons/io_scene_foundry/h3_import/bin/h3-animation-bridge.exe
      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: .cache/blender-5.2.1-linux-x64
          key: blender-5.2.1-linux-x64
      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -L --fail --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C .cache
      - name: Download CoACD wheel
        run: |
          curl -L --fail --retry 3 https://files.pythonhosted.org/packages/00/83/c50472ce98175fddd86d4aba861fea89f30350a5487880b3a81d34915a85/coacd-1.0.11-cp39-abi3-win_amd64.whl -o blender/addons/io_scene_foundry/wheels/coacd-1.0.11-cp39-abi3-win_amd64.whl
          echo "4de22f70d1a3fa8c44698c8006a223fe5fb0ee84b76adecf3726cf2003e9145f  blender/addons/io_scene_foundry/wheels/coacd-1.0.11-cp39-abi3-win_amd64.whl" | sha256sum -c -
      - name: Build test extension
        run: |
          .cache/blender-5.2.1-linux-x64/blender --command extension build --source-dir blender/addons/io_scene_foundry --output-filepath Foundry-Fast-1.9.37-parallel-bitmaps.zip
          python3 tests/verify_parallel_bitmap_package.py Foundry-Fast-1.9.37-parallel-bitmaps.zip
          sha256sum Foundry-Fast-1.9.37-parallel-bitmaps.zip > Foundry-Fast-1.9.37-parallel-bitmaps.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Foundry-parallel-bitmaps-test-1.9.37
          path: |
            Foundry-Fast-1.9.37-parallel-bitmaps.zip
            Foundry-Fast-1.9.37-parallel-bitmaps.sha256
            Foundry-Fast-1.9.37-parallel-bitmaps.verification.json
          if-no-files-found: error
