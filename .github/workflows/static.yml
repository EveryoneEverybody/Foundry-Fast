name: Build and deploy Foundry extension

on:
  push:
    branches: ["master", "release/foundry-fast"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or SHA to package
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  helper:
    runs-on: windows-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      has_bridge: ${{ steps.source.outputs.has_bridge }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
      - name: Identify source and helper
        id: source
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          $hasBridge = Test-Path tools/h3_object_bridge/Cargo.toml
          "has_bridge=$($hasBridge.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Build and test H3 helpers
        if: steps.source.outputs.has_bridge == 'true'
        shell: pwsh
        run: |
          cargo build --release --manifest-path tools/h3_object_bridge/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path tools/h3_object_bridge/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $helpers = @('h3-object-bridge.exe')
          if (Test-Path tools/h3_object_bridge/src/bin/h3-shader-bridge.rs) {
            $helpers += 'h3-shader-bridge.exe'
          }
          foreach ($helper in $helpers) {
            if (!(Test-Path "tools/h3_object_bridge/target/release/$helper")) {
              throw "Missing helper: $helper"
            }
          }
      - name: Upload H3 helpers
        if: steps.source.outputs.has_bridge == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pages-h3-helpers
          path: tools/h3_object_bridge/target/release/*.exe
          if-no-files-found: error

  deploy:
    needs: helper
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.helper.outputs.source_sha }}
      - name: Install H3 helpers
        if: needs.helper.outputs.has_bridge == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pages-h3-helpers
          path: blender/addons/io_scene_foundry/h3_import/bin
      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .cache/blender-5.2.1-linux-x64
          key: blender-5.2.1-linux-x64
      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -L --fail --retry 3 \
            https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz \
            -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C .cache
      - name: Test H3 importer
        if: needs.helper.outputs.has_bridge == 'true'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          python3 -m unittest discover -s tests -p 'test_h3_import*.py' -v
          for test in tests/blender_h3_*smoke.py; do
            xvfb-run -a .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python "$test"
          done
      - name: Download CoACD wheel
        run: |
          curl -L --fail --retry 3 \
            https://files.pythonhosted.org/packages/00/83/c50472ce98175fddd86d4aba861fea89f30350a5487880b3a81d34915a85/coacd-1.0.11-cp39-abi3-win_amd64.whl \
            -o blender/addons/io_scene_foundry/wheels/coacd-1.0.11-cp39-abi3-win_amd64.whl
          echo "4de22f70d1a3fa8c44698c8006a223fe5fb0ee84b76adecf3726cf2003e9145f  blender/addons/io_scene_foundry/wheels/coacd-1.0.11-cp39-abi3-win_amd64.whl" | sha256sum -c -
      - name: Build extension repository
        run: |
          mkdir -p site/api/v1/extensions
          rm -f site/api/v1/extensions/io_scene_foundry.zip
          rm -f site/api/v1/extensions/index.json
          rm -f site/api/v1/extensions/index.html
          .cache/blender-5.2.1-linux-x64/blender --command extension build \
            --source-dir blender/addons/io_scene_foundry \
            --output-filepath site/api/v1/extensions/io_scene_foundry.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json, subprocess, tomllib
          root = Path('blender/addons/io_scene_foundry')
          version = tomllib.loads((root / 'blender_manifest.toml').read_text())['version']
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with ZipFile('site/api/v1/extensions/io_scene_foundry.zip') as package:
              assert package.testzip() is None
              for name in ('h3-object-bridge', 'h3-shader-bridge'):
                  source = Path('tools/h3_object_bridge/src/main.rs') if name == 'h3-object-bridge' else Path('tools/h3_object_bridge/src/bin/h3-shader-bridge.rs')
                  if source.exists():
                      assert package.read(f'h3_import/bin/{name}.exe')[:2] == b'MZ', name
          Path('site/api/v1/extensions/build.json').write_text(json.dumps({'version': version, 'source_sha': sha}, indent=2))
          print(f'Pages package: Foundry {version}, source {sha}')
          PY
          .cache/blender-5.2.1-linux-x64/blender --command extension server-generate \
            --repo-dir site/api/v1/extensions \
            --html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published extension feed
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import time
          from urllib.request import Request, urlopen

          directory = Path('site/api/v1/extensions')
          expected = json.loads((directory / 'build.json').read_text())
          archive = (directory / 'io_scene_foundry.zip').read_bytes()
          digest = 'sha256:' + hashlib.sha256(archive).hexdigest()
          base = os.environ['PAGE_URL'].rstrip('/') + '/api/v1/extensions/'

          def fetch(name):
              request = Request(base + name, headers={'Cache-Control': 'no-cache'})
              with urlopen(request, timeout=30) as response:
                  data = response.read(128 * 1024 * 1024 + 1)
              if len(data) > 128 * 1024 * 1024:
                  raise ValueError('Published response exceeds 128 MiB')
              return data

          for attempt in range(12):
              try:
                  actual = json.loads(fetch('build.json'))
                  if actual != expected:
                      raise ValueError(f'Build metadata mismatch: {actual}')
                  index = json.loads(fetch('index.json'))
                  entries = [e for e in index['data'] if e['id'] == 'io_scene_foundry']
                  if len(entries) != 1:
                      raise ValueError('Expected one Foundry extension entry')
                  entry = entries[0]
                  if (entry['version'] != expected['version'] or entry['archive_hash'] != digest
                          or entry['archive_size'] != len(archive)
                          or entry['archive_url'] != './io_scene_foundry.zip'):
                      raise ValueError('Published index does not match the built extension')
                  downloaded = fetch('io_scene_foundry.zip')
                  if len(downloaded) != len(archive) or 'sha256:' + hashlib.sha256(downloaded).hexdigest() != digest:
                      raise ValueError('Published package does not match the built extension')
                  print('FEED_VERIFIED ' + json.dumps({**expected, 'index_url': base + 'index.json',
                                                       'archive_hash': digest, 'archive_size': len(archive)}))
                  break
              except (OSError, ValueError, KeyError, TypeError) as exc:
                  if attempt == 11:
                      raise
                  print(f'Waiting for Pages propagation ({attempt + 1}/12): {exc}', flush=True)
                  time.sleep(10)
          PY
