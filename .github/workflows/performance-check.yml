name: Validate Foundry performance release

on:
  push:
    branches: ["integration/performance-release"]
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - name: Check selective release scope
        if: github.ref == 'refs/heads/integration/performance-release'
        shell: bash
        run: |
          test -z "$(git diff --name-only e24758911f39749a57d18bc54d9fe6233302d07c HEAD -- blender/addons/io_scene_foundry/h3_import tools/h3_object_bridge tools/h3_animation_bridge blender/addons/io_scene_foundry/tools/importer.py blender/addons/io_scene_foundry/managed_blam/bitmap.py)"
      - name: Cache Blender
        uses: actions/cache@v4
        id: blender
        with:
          path: .cache/blender-5.2.1-${{ runner.os == 'Windows' && 'windows' || 'linux' }}-x64
          key: blender-5.2.1-${{ runner.os == 'Windows' && 'windows' || 'linux' }}-x64
      - name: Download Linux Blender
        if: runner.os == 'Linux' && steps.blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -L --fail --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C .cache
      - name: Download Windows Blender
        if: runner.os == 'Windows' && steps.blender.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache | Out-Null
          curl.exe -L --fail --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-windows-x64.zip -o "$env:RUNNER_TEMP/blender.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive "$env:RUNNER_TEMP/blender.zip" .cache
      - name: Validate worker and scenario logic on Linux
        if: runner.os == 'Linux'
        run: |
          PY=.cache/blender-5.2.1-linux-x64/5.2/python/bin/python3.13
          "$PY" -m unittest discover -s tests -p 'test_bitmap*.py' -v
          "$PY" -m unittest discover -s tests -p 'test_scenario*.py' -v
          "$PY" -m unittest discover -s tests -p 'test_h3_import*.py' -v
          for test in parallel_bitmaps scenario_direct scenario_reference_drivers; do
            .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/blender_${test}_smoke.py
          done
          for test in tests/blender_h3_*smoke.py; do
            LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python "$test"
          done
      - name: Validate workers and Blender loading on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $py = '.cache/blender-5.2.1-windows-x64/5.2/python/bin/python.exe'
          & $py -m unittest discover -s tests -p 'test_bitmap*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m unittest discover -s tests -p 'test_scenario*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .cache/blender-5.2.1-windows-x64/blender.exe --background --factory-startup --python-exit-code 1 --python tests/blender_parallel_bitmaps_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
