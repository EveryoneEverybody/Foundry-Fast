name: Test and package H3 scenario prototype

on:
  push:
    branches: ["feature/h3-scenario-inspection"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: camden-smallwood/definitions
          ref: 0b21715e93110a28aaf53bc7122bba5d96b496aa
          path: .cache/reference-definitions
          sparse-checkout: halo3_mcc
      - name: Capture source verification snapshot
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib, json, subprocess
          root = Path.cwd()
          paths = []
          for folder in ('tests', 'blender/addons/io_scene_foundry', 'tools', '.github/workflows'):
              paths += [p for p in (root / folder).rglob('*') if p.is_file() and p.suffix in ('.py', '.rs', '.toml', '.lock', '.yml', '.json') and 'target' not in p.parts]
          paths += [root / '.cache/reference-definitions/halo3_mcc/scenario.json']
          hashes = {}
          with ZipFile('h3-scenario-source.zip', 'w', ZIP_DEFLATED) as archive:
              for path in sorted(paths):
                  name = path.relative_to(root).as_posix()
                  content = path.read_bytes()
                  hashes[name] = hashlib.sha256(content).hexdigest()
                  archive.writestr(name, content)
              archive.writestr('source-verification.json', json.dumps({'source_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'sha256':hashes},indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: h3-scenario-source-verification
          path: h3-scenario-source.zip
          if-no-files-found: error
      - name: Validate scenario manifests and existing H3 import logic
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_h3_scenario*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_h3_import*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test and build extraction helpers
        env:
          H3_LARGE_INVENTORY_OUTPUT: ${{ runner.temp }}/h3-large-inventory
        shell: pwsh
        run: |
          cargo test --manifest-path tools/h3_object_bridge/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/h3_scenario_large_inventory.py "$env:H3_LARGE_INVENTORY_OUTPUT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --manifest-path tools/h3_object_bridge/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path tools/h3_animation_bridge/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --manifest-path tools/h3_animation_bridge/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tools/h3_object_bridge/target/release/h3-scenario-inspect.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: h3-scenario-helpers-windows
          path: |
            tools/h3_object_bridge/target/release/h3-object-bridge.exe
            tools/h3_object_bridge/target/release/h3-shader-bridge.exe
            tools/h3_object_bridge/target/release/h3-scenario-inspect.exe
            tools/h3_animation_bridge/target/release/h3-animation-bridge.exe
          if-no-files-found: error

  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test validation and planning
        run: python3 -m unittest discover -s tests -p 'test_h3_import*.py' -v
      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: .cache/blender-5.2.1-linux-x64
          key: blender-5.2.1-linux-x64
      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -L --fail --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C .cache
      - name: Test animation staging and persistence
        run: .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/blender_h3_animation_persistence_smoke.py
      - name: Test existing-armature animation import
        run: .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/blender_h3_animation_append_smoke.py
      - name: Test time overlay composition and persistence
        run: .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/blender_h3_overlay_smoke.py
      - name: Test aim screen samples and persistence
        run: .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/blender_h3_blend_screen_smoke.py
      - name: Test H3 import paths and volume display
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          for test in import preferences materials provenance illumination reach volumes; do
            xvfb-run -a .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/blender_h3_${test}_smoke.py
          done
      - name: Test BSP context, authored hints and persistence
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/blender_h3_scenario_archive_smoke.py
      - name: Test scenario and object coordinate consistency
        run: .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/blender_h3_scenario_units_smoke.py
      - name: Test cached scenario placements and authored content
        run: .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/blender_h3_scenario_content_smoke.py
      - name: Test terrain albedo and BSP material diagnostics
        run: .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/blender_h3_scenario_materials_smoke.py

  package:
    needs: [inspect, blender]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: h3-scenario-helpers-windows
          path: .cache/helpers
      - name: Install built helpers
        run: |
          mkdir -p blender/addons/io_scene_foundry/h3_import/bin
          find .cache/helpers -name '*.exe' -exec cp {} blender/addons/io_scene_foundry/h3_import/bin/ \;
          test -f blender/addons/io_scene_foundry/h3_import/bin/h3-animation-bridge.exe
      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: .cache/blender-5.2.1-linux-x64
          key: blender-5.2.1-linux-x64
      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -L --fail --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C .cache
      - name: Download CoACD wheel
        run: |
          curl -L --fail --retry 3 https://files.pythonhosted.org/packages/00/83/c50472ce98175fddd86d4aba861fea89f30350a5487880b3a81d34915a85/coacd-1.0.11-cp39-abi3-win_amd64.whl -o blender/addons/io_scene_foundry/wheels/coacd-1.0.11-cp39-abi3-win_amd64.whl
          echo "4de22f70d1a3fa8c44698c8006a223fe5fb0ee84b76adecf3726cf2003e9145f  blender/addons/io_scene_foundry/wheels/coacd-1.0.11-cp39-abi3-win_amd64.whl" | sha256sum -c -
      - name: Build test extension
        run: |
          .cache/blender-5.2.1-linux-x64/blender --command extension build --source-dir blender/addons/io_scene_foundry --output-filepath Foundry-Fast-1.9.42-H3-scenarios.zip
          python3 tests/verify_h3_scenario_package.py Foundry-Fast-1.9.42-H3-scenarios.zip
          sha256sum Foundry-Fast-1.9.42-H3-scenarios.zip > Foundry-Fast-1.9.42-H3-scenarios.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Foundry-H3-scenarios-test-1.9.42
          path: |
            Foundry-Fast-1.9.42-H3-scenarios.zip
            Foundry-Fast-1.9.42-H3-scenarios.sha256
            Foundry-Fast-1.9.42-H3-scenarios.verification.json
