name: Test Halo 3 shader importer

on:
  push:
    branches: ["feature/h3-shader-import", "feature/h3-material-provenance"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h3-shader-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build extraction helpers
        run: cargo build --release --manifest-path tools/h3_object_bridge/Cargo.toml
      - name: Test extraction helpers
        run: cargo test --manifest-path tools/h3_object_bridge/Cargo.toml
      - name: Upload test helpers
        uses: actions/upload-artifact@v4
        with:
          name: h3-shader-helpers-windows
          path: |
            tools/h3_object_bridge/target/release/h3-object-bridge.exe
            tools/h3_object_bridge/target/release/h3-shader-bridge.exe

  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test bridge validation and material planning
        run: python3 -m unittest discover -s tests -p 'test_h3_import*.py' -v
      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: .cache/blender-5.2.1-linux-x64
          key: blender-5.2.1-linux-x64
      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -L --fail --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C .cache
      - name: Test Blender construction
        run: .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/blender_h3_import_smoke.py
      - name: Test Blender preference integration
        run: .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/blender_h3_preferences_smoke.py
      - name: Test packed material previews
        run: .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/blender_h3_materials_smoke.py
      - name: Test source material provenance
        run: .cache/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/blender_h3_provenance_smoke.py

  package:
    needs: [helper, blender]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: h3-shader-helpers-windows
          path: blender/addons/io_scene_foundry/h3_import/bin
      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: .cache/blender-5.2.1-linux-x64
          key: blender-5.2.1-linux-x64
      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -L --fail --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C .cache
      - name: Download CoACD wheel
        run: |
          curl -L --fail --retry 3 https://files.pythonhosted.org/packages/00/83/c50472ce98175fddd86d4aba861fea89f30350a5487880b3a81d34915a85/coacd-1.0.11-cp39-abi3-win_amd64.whl -o blender/addons/io_scene_foundry/wheels/coacd-1.0.11-cp39-abi3-win_amd64.whl
          echo "4de22f70d1a3fa8c44698c8006a223fe5fb0ee84b76adecf3726cf2003e9145f  blender/addons/io_scene_foundry/wheels/coacd-1.0.11-cp39-abi3-win_amd64.whl" | sha256sum -c -
      - name: Build test extension
        run: |
          .cache/blender-5.2.1-linux-x64/blender --command extension build --source-dir blender/addons/io_scene_foundry --output-filepath io_scene_foundry_h3_shaders_test.zip
          sha256sum io_scene_foundry_h3_shaders_test.zip > io_scene_foundry_h3_shaders_test.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Foundry-H3-shaders-test-1.9.27
          path: |
            io_scene_foundry_h3_shaders_test.zip
            io_scene_foundry_h3_shaders_test.sha256
